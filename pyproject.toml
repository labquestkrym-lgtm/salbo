[project]
name = "trading-bot"
version = "0.1.0"
description = "Delta-hedged long straddle options bot with adaptive gamma scalping"
requires-python = ">=3.12"
readme = "README.md"

# Dependencies are version-pinned with lower bounds; a lockfile (uv.lock /
# requirements.lock) should pin exact versions for reproducible deploys.
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "backtest", "paper", "workers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "backtest", "paper", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "ASYNC", "TID"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "backtest", "paper", "workers"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
# Third-party libs without stubs
[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "scenario: end-to-end trading scenario tests",
    "integration: requires external services (db/broker)",
]

[tool.coverage.run]
branch = true
source = ["app", "backtest", "paper"]
