name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (ruff)
        run: ruff format --check app backtest workers tests

      - name: Lint (ruff)
        run: ruff check app backtest workers tests

      - name: Type check (mypy)
        run: mypy app backtest workers

      - name: Tests (pytest)
        run: pytest -q

  migrations:
    name: alembic migration applies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Apply the schema against a throwaway SQLite DB (Postgres parity is
      # exercised in deployment; the migration itself is backend-agnostic here).
      - name: alembic upgrade head
        env:
          ALEMBIC_URL: sqlite:///./ci_migration_check.db
        run: alembic upgrade head
